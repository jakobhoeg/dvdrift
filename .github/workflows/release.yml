name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required so the runner can mint the OIDC token that NuGet Trusted
      # Publishing exchanges for a short-lived API key.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack tool
        run: dotnet pack src/Dataverse.SolutionDiff.Cli/Dataverse.SolutionDiff.Cli.csproj --configuration Release --output artifacts

      # Trusted Publishing: no long-lived secret. Requires a policy on nuget.org
      # (Account -> Trusted Publishing) bound to this repo, this workflow file,
      # and the DataverseDrift package. Exchanges the OIDC token above for an
      # API key valid for a few minutes, exported as NUGET_API_KEY.
      - name: Authenticate to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: jakobhoeg

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      # Release notes come from the tag's CHANGELOG.md section, not from the
      # raw commit list. Falls back to generated notes if the section is missing.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1        { found = 1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found                       { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG.md section for $version; using generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}

      # Moves the floating major tag (v1.2.3 -> v1) so `uses: jakobhoeg/dvdrift@v1`
      # keeps resolving to the newest release in that major line.
      - name: Move the major version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          major="$(echo "$GITHUB_REF_NAME" | cut -d. -f1)"
          git tag -f "$major"
          git push -f origin "$major"
